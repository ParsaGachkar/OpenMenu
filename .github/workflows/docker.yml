name: Docker

# Builds and publishes the OpenMenu image to GHCR (ghcr.io):
#   ghcr.io/<owner>/<repo>:latest  for pushes to main (green CI required)
#   ghcr.io/<owner>/<repo>:<tag>   for version tags (v1.2.3 -> 1.2.3, 1.2, 1)
#   main + full SHA tags on every publish
# Pull requests get a build-only sanity check (no push, no registry login).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=ref,event=pr

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        # Starts the freshly built image against a disposable Postgres and
        # checks it serves the public menu — catches broken images before release.
        if: github.event_name != 'pull_request'
        run: |
          # The repository name may contain uppercase (github.repository);
          # GHCR image references must be lowercase.
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${IMAGE,,}"
          docker rm -f smoke-app smoke-db > /dev/null 2>&1 || true
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_DB=openmenu -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres:18-alpine
          # App startup migrates the database — wait until Postgres accepts connections.
          for i in $(seq 1 20); do
            if docker exec smoke-db pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker run -d --name smoke-app --network smoke -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__Default="Host=smoke-db;Port=5432;Database=openmenu;Username=postgres;Password=postgres" \
            -e Seed__AdminUsername=admin -e Seed__AdminPassword=admin123 \
            "$IMAGE:${{ steps.meta.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "Smoke test passed"; exit 0
            fi
            sleep 2
          done
          echo "Image did not become ready in time"; docker logs smoke-app; exit 1
