name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build OpenMenu.slnx

      - name: Unit tests
        run: dotnet test tests/OpenMenu.Tests --no-build --verbosity normal

      - name: Start stack (app + PostgreSQL)
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8088/; then
              echo "App is up"; exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"; docker compose logs app; exit 1

      - name: End-to-end tests (Playwright)
        env:
          OPENMENU_BASEURL: http://localhost:8088
        run: dotnet test tests/OpenMenu.E2ETests --no-build --verbosity normal

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            **/playwright-report/**
            **/test-results/**
          if-no-files-found: ignore
